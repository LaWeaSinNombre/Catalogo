<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Título de la pestaña del navegador -->
  <title>Catálogo - Nombre de tu Marca</title>

  <!-- Favicon para la pestaña de Chrome/Navegador -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- CONFIGURACIÓN PARA LA VISTA PREVIA DE WHATSAPP -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://laweasinnombre.github.io/Catalogo/">
  <meta property="og:title" content="Catálogo de Productos">
  <meta property="og:description" content="Haz clic para ver nuestro catálogo completo.">
  
  <!-- Datos de la imagen para la tarjeta de WhatsApp -->
  <meta property="og:image" content="https://laweasinnombre.github.io/Catalogo/favicon.png">
  <meta property="og:image:secure_url" content="https://laweasinnombre.github.io/Catalogo/favicon.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="400">
  <meta property="og:image:height" content="400">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #525659;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Visor de Google Docs embebido para forzar la lectura del PDF en celulares -->
  <iframe src="https://docs.google.com/gview?url=https://laweasinnombre.github.io/Catalogo/Catalogo.pdf&embedded=true"></iframe>

</html>
