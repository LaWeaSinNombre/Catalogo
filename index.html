<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catálogo Digital de Perfumes</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Catálogo Digital de Perfumes">
  <meta property="og:description" content="Haz clic para ver nuestro catálogo.">
  <meta property="og:image" content="https://laweasinnombre.github.io/Catalogo/favicon.png">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Catálogo Digital de Perfumes">
  <meta name="twitter:description" content="Haz clic para ver nuestro catálogo.">
  <meta name="twitter:image" content="https://laweasinnombre.github.io/Catalogo/favicon.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Catálogo</h1>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Buscar perfume, SKU..." autocomplete="off">
      <div id="searchResults" class="search-results"></div>
    </div>

    <select id="jump">
      <option value="">Ir a…</option>
    </select>
  </header>

  <main>
    <div id="book">
      <div class="nav l" id="pl"></div>
      <div class="nav r" id="pr"></div>
      <div class="L" id="under"></div>
      <div class="L" id="leaf"></div>
    </div>
  </main>

  <footer>
    <button id="bp" disabled>Anterior</button>
    <span id="cnt">1 / 1</span>
    <button id="bn">Siguiente</button>
  </footer>

  <!-- Botón Flotante del Carrito -->
  <button id="cart-float-btn" onclick="toggleCart()" title="Ver pedido">
    🛒 <span id="cart-count">0</span>
  </button>

  <!-- Modal 1: Vista Detallada del Producto -->
  <div id="product-modal" class="modal">
    <div class="modal-overlay" onclick="closeProductModal()"></div>
    <div class="modal-content product-detail-content">
      <button class="modal-close" onclick="closeProductModal()">✕</button>
      <div id="product-detail-body">
        <!-- Contenido generado dinámicamente con JS -->
      </div>
    </div>
  </div>

  <!-- Modal 2: Carrito de Compras -->
  <div id="cart-modal" class="modal">
    <div class="modal-overlay" onclick="toggleCart()"></div>
    <div class="modal-content cart-content">
      <div class="cart-header">
        <h3>Mi Pedido 🛒</h3>
        <button class="modal-close" onclick="toggleCart()">✕</button>
      </div>
      
      <div id="cart-items" class="cart-items">
        <!-- Se genera dinámicamente -->
      </div>
      
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total estimado:</span>
          <strong id="cart-total-price">$0</strong>
        </div>
        <button class="cart-send-btn" onclick="sendWhatsApp()">
          📲 Enviar Pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notificación al agregar -->
  <div id="toast" class="toast">¡Producto agregado al pedido! 🌸</div>

  <script src="script.js"></script>
</body>
</html>
